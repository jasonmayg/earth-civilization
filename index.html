<style>
:root{
  --bg:#e3e6ee; --panel:#f2f3f7; --ink:#1b2440; --muted:#5d647a; --brass:#8a6a24; --line:rgba(27,36,64,.14);
  --war:#b8452f; --sea:#2d5c8f; --plague:#5f7a3a; --fall:#6b6f7c; --chip:#e7e9f0;
  --serif:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#10182c; --panel:#172039; --ink:#ebe3cf; --muted:#a19b8b; --brass:#cfa95c; --line:rgba(207,169,92,.2);
    --war:#e07a5f; --sea:#7fa8d9; --plague:#9fbf6c; --fall:#8f93a0; --chip:#1f2a48; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10182c; --panel:#172039; --ink:#ebe3cf; --muted:#a19b8b; --brass:#cfa95c; --line:rgba(207,169,92,.2);
  --war:#e07a5f; --sea:#7fa8d9; --plague:#9fbf6c; --fall:#8f93a0; --chip:#1f2a48; color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
.app{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:0;min-height:100%;max-width:1680px;margin:0 auto}
.stage{padding:20px 24px 24px;display:flex;flex-direction:column;gap:14px;min-width:0}
header.top{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap}
h1{font-family:var(--serif);font-weight:900;font-size:clamp(24px,3vw,34px);letter-spacing:.08em;margin:0;line-height:1.2}
.sub{color:var(--muted);font-size:13.5px;margin:4px 0 0}
.seed{color:var(--muted);font-size:13px}
.mapwrap{position:relative;border-radius:6px;overflow:hidden;background:#16223e;box-shadow:0 0 0 1px var(--line)}
canvas#map{display:block;width:100%;height:auto;cursor:crosshair;touch-action:none}
.yearbox{position:absolute;left:18px;bottom:14px;pointer-events:none;color:#f1e7cf;text-shadow:0 2px 12px rgba(5,10,25,.85),0 0 2px rgba(5,10,25,.9)}
.yearbox .ad{font-family:var(--serif);font-size:clamp(13px,1.4vw,17px);letter-spacing:.3em;opacity:.85}
.yearbox .yr{font-family:var(--serif);font-weight:900;font-size:clamp(34px,6.2vw,84px);line-height:.95;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.yearbox .yr small{font-size:.38em;font-weight:700;margin-left:.15em}
.yearbox .era{font-family:var(--serif);font-size:clamp(14px,1.6vw,20px);color:#e2c27d;margin-top:4px;letter-spacing:.12em}
.tip{position:absolute;pointer-events:none;background:rgba(14,20,38,.92);color:#efe6d0;font-size:12.5px;line-height:1.5;padding:7px 10px;border-radius:4px;border:1px solid rgba(207,169,92,.35);white-space:nowrap;display:none;z-index:3}
.tip b{font-weight:700;color:#e8c77f}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
button{font:inherit;color:inherit;cursor:pointer}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:7px 16px;font-size:14px}
a.btn{color:inherit;text-decoration:none;display:inline-flex;align-items:center}
.langlink{float:right;margin:-34px 34px 0 0;font-size:13px;color:var(--brass);text-decoration:none;border:1px solid var(--line);border-radius:4px;padding:2px 9px}.langlink:hover{border-color:var(--brass)}
.btn.primary{background:var(--brass);border-color:var(--brass);color:var(--bg);font-weight:700;min-width:88px}
.btn:hover{border-color:var(--brass)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:var(--panel)}
.seg button{background:none;border:0;padding:7px 12px;font-size:13.5px;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--chip);color:var(--ink);font-weight:700;box-shadow:inset 0 -2px 0 var(--brass)}
.grow{flex:1}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.legend{font-size:12.5px;color:var(--muted)}
.river{margin-top:6px}
.rhead{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:8px}
.rhead h2{font-family:var(--serif);font-size:16px;font-weight:700;margin:0;letter-spacing:.1em}
canvas#hist{display:block;width:100%;height:clamp(120px,22vh,200px);background:var(--chip);border-radius:4px;cursor:pointer}
aside{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;max-height:100vh;max-height:100dvh;position:sticky;top:0;overflow-y:auto}
aside section{padding:16px 20px;border-bottom:1px solid var(--line)}
aside h2{font-family:var(--serif);font-size:16px;font-weight:700;margin:0 0 10px;letter-spacing:.1em}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(72px,1fr));gap:8px}
.stat .v{font-family:var(--serif);font-weight:700;font-size:19px;font-variant-numeric:tabular-nums;line-height:1.3}
.stat .k{font-size:12px;color:var(--muted);line-height:1.4}
ol.rank{list-style:none;margin:0;padding:0}
ol.rank li button{display:grid;grid-template-columns:12px 1fr auto;gap:8px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:4px 6px;margin:0 -6px;border-radius:3px;font-size:13.5px}
ol.rank li button:hover,ol.rank li button[aria-current="true"]{background:var(--chip)}
.sw{width:12px;height:12px;border-radius:2px;display:inline-block}
.rank .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .nm small{color:var(--muted);margin-left:6px;font-size:12px}
.rank .num{color:var(--muted);font-variant-numeric:tabular-nums;font-size:12.5px}
.card .title{display:flex;align-items:center;gap:10px}
.card .title .nm{font-family:var(--serif);font-weight:900;font-size:20px;line-height:1.3}
.card dl{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;margin:10px 0 0;font-size:13.5px}
.card dt{color:var(--muted)}
.card dd{margin:0;font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--chip);border-radius:3px;overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;background:var(--brass)}
.empty{color:var(--muted);font-size:13.5px;margin:0}
.linkish{background:none;border:0;color:var(--muted);font-size:12.5px;padding:0;text-decoration:underline;text-underline-offset:3px;margin-top:8px}
section.chron{flex:1;min-height:320px;display:flex;flex-direction:column;border-bottom:0;padding-bottom:0}
ul.log{list-style:none;margin:0 -20px;padding:0 20px 16px;overflow-y:auto;flex:1}
ul.log li{display:grid;grid-template-columns:64px 1fr;gap:10px;padding:6px 0 6px 10px;border-left:2px solid var(--line);font-size:13.5px;line-height:1.55}
ul.log li .y{color:var(--muted);font-variant-numeric:tabular-nums;font-size:12.5px;padding-top:1px}
ul.log li.war{border-left-color:var(--war)}
ul.log li.era,ul.log li.win{border-left-color:var(--brass)}
ul.log li.era .t,ul.log li.win .t{font-weight:700}
ul.log li.sea{border-left-color:var(--sea)}
ul.log li.plague{border-left-color:var(--plague)}
ul.log li.fall{border-left-color:var(--fall)}
ul.log li.doom{border-left-color:var(--war);background:color-mix(in srgb,var(--war) 10%,transparent)}
ul.log li.gold{border-left-color:color-mix(in srgb,var(--brass) 55%,transparent)}
.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(8,12,26,.62);z-index:4;padding:16px}
.modal.show{display:flex}
.modal .box{background:var(--panel);color:var(--ink);max-width:460px;width:100%;border-radius:6px;padding:24px 26px;border:1px solid var(--line)}
.modal h3{font-family:var(--serif);font-weight:900;font-size:24px;margin:0 0 8px;letter-spacing:.06em}
.modal p{margin:0 0 6px;font-size:14px}
.modal .row{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
@media (max-width:980px){
  .app{grid-template-columns:1fr}
  aside{position:static;max-height:none;border-left:0;border-top:1px solid var(--line)}
  section.chron{min-height:0}
  ul.log{max-height:420px}
  .stage{padding:14px 14px 18px}
}
@media (max-width:560px){
  .yearbox{left:10px;bottom:8px}
  .legend{display:none}
  .seg button{padding:7px 9px}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}

.banner{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:rgba(14,20,38,.9);color:#f1e7cf;border:1px solid rgba(207,169,92,.5);padding:7px 14px;border-radius:4px;font-size:13.5px;display:none;z-index:2;max-width:calc(100% - 24px);text-align:center}
.banner.show{display:block}
.godbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.godbar .mana{font-size:13px;color:var(--muted);min-width:92px}
.godbar .mana b{font-family:var(--serif);font-size:17px;color:var(--ink);font-variant-numeric:tabular-nums}
.pw{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:5px 11px;font-size:13.5px;display:inline-flex;gap:6px;align-items:baseline}
.pw small{color:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums}
.pw[aria-pressed="true"]{border-color:var(--brass);background:var(--chip);box-shadow:inset 0 -2px 0 var(--brass)}
.pw:disabled{opacity:.45;cursor:not-allowed}
.me .nm{font-family:var(--serif);font-weight:900;font-size:19px}
.me .row{display:flex;align-items:center;gap:10px}
.me .meta{color:var(--muted);font-size:13px;margin:2px 0 10px}
.me .mini{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.me .mini div{font-size:12px;color:var(--muted)}
.me .mini b{display:block;font-family:var(--serif);font-size:16px;color:var(--ink);font-variant-numeric:tabular-nums}
.me .seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(64px,1fr));width:100%}
.me .seg button+button{border-left:0}
.me .seg button{border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.me .seg button{flex:1;padding:6px 0}
.pdesc{font-size:12.5px;color:var(--muted);margin:6px 0 10px}
.achs{display:flex;flex-wrap:wrap;gap:5px}
.achs span{font-size:12px;padding:2px 8px;border-radius:10px;border:1px dashed var(--line);color:var(--muted)}
.achs span.on{border-style:solid;border-color:var(--brass);color:var(--ink);background:color-mix(in srgb,var(--brass) 16%,transparent)}
.oracle{font-size:13.5px;margin:10px 0 0}
.chip{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:10px;margin-left:6px;border:1px solid var(--line);color:var(--muted)}
.chip.done{border-color:var(--plague);color:var(--plague)}
.chip.fail{border-color:var(--war);color:var(--war)}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.acts .btn{padding:5px 12px;font-size:13px}
.acts .btn.danger{border-color:color-mix(in srgb,var(--war) 60%,transparent);color:var(--war)}
.actmsg{font-size:12.5px;color:var(--muted);margin:6px 0 0}
ul.log li.you{border-left-color:var(--brass);background:color-mix(in srgb,var(--brass) 9%,transparent)}
ul.log li.god{border-left-color:#9a7ad6}
ul.log li.hist{border-left-color:var(--brass)}
ul.log li.hist .t{font-family:var(--serif);font-weight:700}
ul.log li.rel{border-left-color:#9a7ad6}
ul.log li.trade{border-left-color:color-mix(in srgb,var(--brass) 70%,transparent)}
ul.log li.nomad{border-left-color:#c58a4a}
ul.log li.person{border-left-color:var(--brass)}
ul.log li.person .t{font-family:var(--serif)}
ul.log li.econ{border-left-color:color-mix(in srgb,var(--sea) 60%,var(--brass))}
ul.log li.climate{border-left-color:#d08a3a}
ul.log li.tech{border-left-color:var(--brass)}
ul.log li.tech .t{font-weight:700}
ul.log li.elec{border-left-color:var(--sea)}
.tracks{display:grid;grid-template-columns:auto 1fr auto;gap:3px 8px;align-items:center;font-size:12.5px;margin-top:4px}
.tracks .bar{margin:0;height:5px}
.tracks span:nth-child(3n){color:var(--muted);font-variant-numeric:tabular-nums}
.note{font-size:12.5px;color:var(--muted);margin:8px 0 0;line-height:1.5}
.blocleg{display:inline-flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--muted)}
.blocleg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
ul.log li.dip,ul.log li.ruler{border-left-color:var(--sea)}
.modal .box{max-height:calc(100dvh - 32px);overflow-y:auto}
.modal .box.wide{max-width:640px}
.lead{color:var(--muted);font-size:14px;margin:0 0 14px}
fieldset{border:0;padding:0;margin:0 0 16px}
legend{font-family:var(--serif);font-weight:700;font-size:15px;margin-bottom:8px;padding:0;letter-spacing:.06em}
.opts{display:grid;gap:8px}
.opts.three{grid-template-columns:repeat(3,1fr)}
.opts.two{grid-template-columns:repeat(2,1fr)}
.opt{text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:10px 12px;display:block;width:100%}
.opt b{display:block;font-family:var(--serif);font-size:16px;margin-bottom:3px}
.opt span{font-size:12.5px;color:var(--muted);line-height:1.5;display:block}
.opt[aria-pressed="true"]{border-color:var(--brass);box-shadow:inset 0 0 0 1px var(--brass);background:var(--chip)}
.field{display:flex;flex-direction:column;gap:5px;font-size:13.5px;margin-bottom:14px}
.field select,.field input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:7px 10px}
.cardopts{display:grid;gap:8px;margin-top:14px}
.cardopts .opt b{font-size:15px}
@media (max-width:560px){.opts.three,.opts.two{grid-template-columns:1fr}}

.headline{position:absolute;left:50%;top:14%;transform:translate(-50%,0);max-width:min(78%,720px);text-align:center;pointer-events:auto;cursor:pointer;
  font-family:var(--serif);font-weight:900;font-size:clamp(17px,2.3vw,28px);line-height:1.35;color:#f6ecd2;letter-spacing:.04em;
  text-shadow:0 2px 16px rgba(4,8,20,.95),0 0 3px rgba(4,8,20,.9);opacity:0;transition:opacity .45s ease,transform .45s ease;z-index:2}
.headline.show{opacity:1;transform:translate(-50%,-6px)}
.headline small{display:block;font-size:.55em;font-weight:500;letter-spacing:.3em;color:#e2c27d;margin-bottom:4px}
.zoombar{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:4px;z-index:2}
.zoombar button{width:30px;height:30px;border-radius:4px;border:1px solid rgba(207,169,92,.45);background:rgba(14,20,38,.78);color:#f1e7cf;font-size:15px;line-height:1}
.zoombar button:hover{background:rgba(30,40,70,.9)}
canvas#map{cursor:grab}
canvas#map.dragging{cursor:grabbing}
.subbar{margin-top:-4px}
.hdr{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hdr .seed{margin-right:4px}
.hdr .btn{padding:6px 12px;font-size:13.5px}
.flag{display:inline-block;vertical-align:middle;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.25);flex:none}
ol.rank li button{grid-template-columns:18px 1fr auto}
.treasury{display:flex;align-items:baseline;gap:8px;margin:2px 0 8px;font-size:13px;color:var(--muted)}
.treasury b{font-family:var(--serif);font-size:18px;color:var(--ink);font-variant-numeric:tabular-nums}
.me h3{font-family:var(--serif);font-size:14px;font-weight:700;margin:12px 0 6px;letter-spacing:.06em}
.acts2{display:flex;flex-wrap:wrap;gap:6px}
.acts2 .btn{padding:5px 10px;font-size:13px}
.acts2 .btn small{color:var(--muted);margin-left:4px;font-variant-numeric:tabular-nums}
.acts2 .btn:disabled{opacity:.45;cursor:not-allowed}
.advisor{font-size:13px;line-height:1.6;margin:10px 0 0;padding:8px 10px;border-left:2px solid var(--brass);background:color-mix(in srgb,var(--brass) 7%,transparent)}
.goal{font-size:13px;margin:10px 0 0}
.tabs{display:flex;gap:0;margin:0 0 14px;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;padding:8px 14px;font-family:var(--serif);font-size:15px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brass);font-weight:700}
.slots{display:grid;gap:8px}
.slot{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:5px;background:var(--bg)}
.slot b{font-family:var(--serif)}
.slot span{display:block;font-size:12.5px;color:var(--muted)}
.slot .row2{display:flex;gap:6px}
.slot .row2 .btn{padding:4px 10px;font-size:13px}
.snaps{display:flex;flex-wrap:wrap;gap:6px;max-height:300px;overflow-y:auto}
.snaps .btn{padding:5px 10px;font-size:13px;font-variant-numeric:tabular-nums}
.wlist{display:grid;gap:6px}
.wrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:5px;background:var(--bg);font-size:13px}
.wrow b{font-family:var(--serif);font-size:15px}
.wrow span{color:var(--muted);display:block}
.wrow .btn{padding:4px 10px;font-size:13px}
.msg{font-size:13px;color:var(--war);margin:8px 0 0}

:root{--brush:"Ma Shan Zheng","Zhi Mang Xing","STKaiti","KaiTi","Kaiti SC",var(--serif)}
.modal .box.scroll{position:relative;background:#efe4c8 url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='3'/><feColorMatrix values='0 0 0 0 .36 0 0 0 0 .27 0 0 0 0 .17 0 0 0 .1 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  color:#2b2118;border:0;border-radius:2px;padding:36px 30px 30px;box-shadow:0 22px 60px rgba(0,0,0,.55);animation:unroll .7s cubic-bezier(.2,.8,.2,1) both;overflow:visible}

function applyFigure(f) {
  const pl = PLACE[f.p]; if (!pl) return;
  const i = nearestLand(cellOf(pl[0], pl[1])), o = S.owner[i];
  if (o < 0) return;
  const c = S.civs[o], L = lvl(c);
  if (f.r === 'R') { setRuler(c, mkChar(c, { name: f.n, trait: f.t || '贤明', age: 30, boost: 18, real: true, g: FEMALE_FIG.has(f.n) ? 1 : 0 })); c.bonus += 10; }
  else if (f.r === 'G') { S.charSeq = (S.charSeq || 0) + 1; c.hero = { str: 1.35, until: S.year + Math.max(25, stepYears(S.year) * 2), name: f.n, g: FEMALE_FIG.has(f.n) ? 1 : 0, seed: S.charSeq * 7919 }; c.bonus += 4; }
  else if (f.r === 'S') c.tech += boostT(90, c);
  else if (f.r === 'I') c.tech += boostT(120, c);
  else if (f.r === 'P') { c.bonus += 12; c.tech += boostT(40, c); }
  else if (f.r === 'A') { c.bonus += 10; c.age *= 0.8; }
  else if (f.r === 'N') { c.navy += 0.4; c.trade += 5; c.tech += boostT(30, c); }
  else if (f.r === 'M') { c.bonus += 15; c.age *= 0.4; }
  (c.people = c.people || []).push(f.n);
  const own = c.hist && c.hist === (S.civs[o].base) ? '' : '';
  addLog(isPC(c.id) ? 'you' : 'person', `${ROLE[f.r]}${f.n}在${civName(c)}登上历史舞台：${f.d}。${own}`);
}

function chainCard(c) {

    const ch = S.chain; S.chain = null;

  }
  if (S.chain) return null;
  if (R() < 0.35) {
    const ids = Object.keys(CHAINS).filter(k => !(S.chainDone || {})[k] || R() < 0.3);
    for (let t = 0; t < 6 && ids.length; t++) { const k = ids.splice((R() * ids.length) | 0, 1)[0]; const card = CHAINS[k].start(c); if (card) { (S.chainDone = S.chainDone || {})[k] = 1; card.chain = 1; return card; } }
  }
  return null;
}

function inBoxCell(i, b) { const lo = cellLon(i % W), la = cellLat((i / W) | 0); return lo >= b[0] && lo <= b[1] && la >= b[2] && la <= b[3]; }

  if (!had && isPC(c.id)) addLog('you', `国情告急：${CONDS[k].n}。${CONDS[k].d}。`, { cell: c.cap, fx: 'spark' });
}
function endCond(c, k, why) { if (!c.conds || !c.conds[k]) return false; delete c.conds[k]; if (isPC(c.id) && why) addLog('you', `${CONDS[k].n}已经${why}。`); return true; }
function condStab(c) { let s = 0; if (c.conds) for (const k in c.conds) s += CONDS[k].stab || 0; return Math.max(-22, s); }
function condInc(c) { let m = 1; if (c.conds) for (const k in c.conds) m *= CONDS[k].inc || 1; return m; }
function condTick(c, dt) {
  if (!isPC(c.id) || c.modernCiv) { effTick(c); return; }
  if (c.tech < 1) { c.conds = {}; effTick(c); return; }
  c.conds = c.conds || {};
  effTick(c);
  for (const k of Object.keys(c.conds)) {
    const cd = c.conds[k], C = CONDS[k];
    if (C.popY) c.pop *= Math.pow(C.popY, dt);
    if (k === 'border') {
      const en = S.civs[cd.enemy];
      if (!en || !en.alive || isAllied(c.id, en.id) || S.borders && !S.borders.has(pk(c.id, en.id))) { endCond(c, k, '平息'); continue; }
      if (c.cells.length > 4 && R() < (1 - Math.pow(1 - 0.012, dt)) / effMul(c, 'def')) {
        const e = S.borders.get(pk(c.id, en.id));
        if (e && e.pairs.length) { const cell = e.pairs[c.id === e.a ? 0 : 1]; if (S.owner[cell] === c.id && cell !== c.cap) { setOwner(cell, en.id); S.gold = Math.max(0, S.gold - actCost(4)); addLog('you', `${civName(en)}的骑兵劫掠边境，夺走了一片土地和钱粮。`, { cell, fx: 'fall' }); } }
      }
    }
    if (k === 'unrest' && c.stab > 60) { endCond(c, k, '平息'); continue; }
    if (k === 'broke' && S.gold > actCost(15)) { endCond(c, k, '缓解'); continue; }
    if (k === 'weary' && !c.wars) { endCond(c, k, '随着和平到来而消散'); continue; }
    if (cd.until && S.year >= cd.until && k !== 'broke' && k !== 'weary' && k !== 'border') endCond(c, k, '过去');
  }
  // 触发
  if (!c.conds.unrest && c.stab < 25 && R() < 1 - Math.pow(0.98, dt)) addCond(c, 'unrest', 40);
  if (!c.conds.famine && c.stab < 55 && R() < 1 - Math.pow(0.9985, dt)) addCond(c, 'famine', 12 + R() * 15);
  if (!c.conds.broke && S.gold < actCost(3) && (S.income || 0) - (S.upkeep || 0) < 1) addCond(c, 'broke', 999);
  if (!c.conds.weary && c.wars) { const long = [...S.wars.values()].some(w => (w.a === c.id || w.b === c.id) && S.year - w.start > 40); if (long) addCond(c, 'weary', 999); }
  if (!c.conds.border && c.cells.length >= 8 && R() < 1 - Math.pow(1 - 0.004, dt)) {
    const threat = neighbors(c).filter(x => (x.nomad || x.str > c.str * 1.4) && !isAllied(c.id, x.id) && (S.trust[x.id] || 0) < 10);
    if (threat.length) addCond(c, 'border', 999, { enemy: pick(threat).id });
  }
}

const hv = $('hist'), hctx = hv.getContext('2d');
let histDrawn = 0, histFull = true, lastLabelX = -1e9;
const HMARKS0 = [-8000, -6000, -4000, -2000, 0, 1000, 1500, 1800, 1900, 2000, 2100, 2200];
const HMARKS1 = [2030, 2040, 2050, 2060, 2070, 2080, 2090, 2100, 2110, 2120, 2130, 2140, 2150, 2160, 2170, 2180, 2190, 2200];
const histN = () => S.modern ? 150 : 900;
function histGeom() { const n = Math.max(histN(), S.hist.length); return { cw: hv.width / n }; }
function bands(k) {
  const p = S.hist[k].p; let tot = 0; for (let j = 1; j < p.length; j += 2) tot += p[j];
  const out = []; let other = 0;
  for (let j = 0; j < p.length; j += 2) { const f = p[j + 1] / (tot || 1); if (f < 0.025 && p[j] !== S.player) other += f; else out.push([p[j], f]); }
  if (other > 0) out.push([-1, other]);
  return out;
}
function drawHist() {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  if (hv.width !== Math.round(hv.clientWidth * dpr) || hv.height !== Math.round(hv.clientHeight * dpr)) { hv.width = Math.round(hv.clientWidth * dpr); hv.height = Math.round(hv.clientHeight * dpr); histFull = true; }
  if (S.hist.length > histN()) histFull = true;
  const HMARKS = S.modern ? HMARKS1 : HMARKS0;
  const { cw } = histGeom();
  let from = histDrawn;
  if (histFull || from > S.hist.length) { hctx.clearRect(0, 0, hv.width, hv.height); from = 0; histFull = false; lastLabelX = -1e9; }
  const axisH = 16 * dpr, hl = sel >= 0 ? sel : -2;
  for (let k = from; k < S.hist.length; k++) {
    const x = k * cw; let y = 0;
    for (const [id, f] of bands(k)) {
      const h = f * (hv.height - axisH);
      if (id < 0) { hctx.globalAlpha = 0.35; hctx.fillStyle = '#8a8f9c'; }
      else { hctx.globalAlpha = hl >= 0 && id !== hl ? 0.25 : 1; hctx.fillStyle = `rgb(${S.civs[id].color})`; }
      hctx.fillRect(x, y, cw + 0.6, h); y += h;
    }
  }
  hctx.globalAlpha = 1;
  hctx.font = `${11 * dpr}px ${getComputedStyle(document.body).getPropertyValue('--sans')}`; hctx.textBaseline = 'bottom';
  const ink = getComputedStyle(document.body).getPropertyValue('--muted').trim();
  let mi = 0;
  for (let k = 0; k < S.hist.length; k++) {
    while (mi < HMARKS.length && S.hist[k].y >= HMARKS[mi]) {
      if (k >= from && k * cw - lastLabelX > 44 * dpr) { const x = k * cw; lastLabelX = x; hctx.fillStyle = ink; hctx.globalAlpha = .55; hctx.fillRect(x, hv.height - 14 * dpr, 1 * dpr, 14 * dpr); hctx.globalAlpha = 1; hctx.fillText(HMARKS[mi] < 0 ? '前' + (-HMARKS[mi]) : String(HMARKS[mi]), x + 3 * dpr, hv.height - 2 * dpr); }
      mi++;
    }
  }
  histDrawn = S.hist.length;
}
hv.addEventListener('click', ev => {
  const r = hv.getBoundingClientRect(), { cw } = histGeom(), dpr = hv.width / r.width;
  const k = Math.floor((ev.clientX - r.left) * dpr / cw), yy = (ev.clientY - r.top) * dpr, span = hv.height - 16 * dpr;
  if (k < 0 || k >= S.hist.length) return;
  let y = 0;
  for (const [id, f] of bands(k)) { y += f * span; if (yy < y) { if (id >= 0) select(id); return; } }
});

// ---------- 房主：远程席位的抉择与指令 ----------
function hostRemoteCard(k) {

function hostCardTimeouts() {

function onCmdMsg(msg) {

  else if (d.t === 'act') { if (ACTIONS[d.v]) run(() => doAction(d.v)); }
  else if (d.t === 'wonder') { const w = WONDERS.find(x => x.n === d.v); run(() => { const c = S.civs[S.player]; if (w && c && !S.wonders[w.n] && wonderAvail(w) && c.tech >= w.t && S.gold >= w.cost) { S.gold -= w.cost; buildWonder(c, w); } }); }

  }
  NET.lastFrameT = 0; dirty = true; mapDirty = true;
}

// ---------- 房主：广播世界状态 ----------
function encodeOwner() {
  const L = G.landCells; let out = '', cur = S.owner[L[0]], n = 0;
  for (let k = 0; k < L.length; k++) { const v = S.owner[L[k]]; if (v === cur) n++; else { out += (cur + 1).toString(36) + '.' + n.toString(36) + ','; cur = v; n = 1; } }
  return out + (cur + 1).toString(36) + '.' + n.toString(36);
}
function buildFrame(key) {

  const F = { y: Math.round(S.year), mt: +S.maxTech.toFixed(2), mo: S.modern ? 1 : 0, st: [Math.round(S.worldPop), Math.round(S.worldGdp || 0), +(S.temp || 0).toFixed(2), S.wars.size],
    cv: alive.map(c => [c.id, civName(c), c.color[0], c.color[1], c.color[2], c.cap, c.cells.length, +c.tech.toFixed(2), Math.round(S.modern ? c.gdp : c.pop * 100) / 100]),

      return { k, g: Math.floor(slotVal(k, 'gold') || 0), i: +(slotVal(k, 'income') || 0).toFixed(1), civ: pid, st: c ? Math.round(c.stab) : 0, pol: c ? c.policy : 'bal', foc: slotVal(k, 'focus'), dead: !c || !c.alive ? 1 : 0,
        acts: Object.entries(ACTIONS).filter(([, a]) => (a.a ? !S.modern : true) && (a.m ? S.modern : true)).map(([id, a]) => [id, a.n, withSlot(k, () => actCost(a.base))]),
        card: pc ? { id: pc.id, t: pc.card.title, x: pc.card.text, s: pc.card.seal || '议', o: pc.card.opts.map(o => [o.l, o.d]) } : null };

// 由主循环调用：返回 true 表示本帧已处理完毕
function netFrame(t, dtS) {

  if (netRole === 'host' && S.slots) {
    hostCardTimeouts();
    if (t - NET.lastFrameT > 1000) { NET.lastFrameT = t; broadcastFrame(); }

// ---------- 远程玩家：接收画面 ----------
function onFrameMsg(msg) {
  if (netRole !== 'client' || msg.peer !== NET.hostPeer) return;
  const d = msg.data || {}; if (d.c !== NET.code) return;
  const P = NET.parts[d.f] = NET.parts[d.f] || { n: d.n, got: 0, a: [] };
  if (P.a[d.i] == null) { P.a[d.i] = d.d; P.got++; }
  if (P.got === P.n) {
    delete NET.parts[d.f];

function applyFrame(F) {

  for (let i = 0; i <= maxId; i++) if (!civs[i].alive && S.civs[i] && S.civs[i].alive) { civs[i] = { ...S.civs[i], alive: false, cells: [] }; }

  S.wonders = Object.fromEntries((F.wo || []).map(w => [w[0], { cell: w[1], owner: S.owner[w[1]], by: S.owner[w[1]], y: F.y }]));
  S.routes = [];
  for (const l of F.lg || []) { if (l[0] <= NET.lastLogId) continue; NET.lastLogId = l[0]; S.logSeq++; const e = { id: S.logSeq, y: l[1], k: l[2], t: l[3] }; if (l[4]) e.big = 1; if (l[5] >= 0) e.cell = l[5]; if (l[6] && l[6] !== 'battle' && l[6] !== 'crown') e.fx = l[6]; S.log.push(e); if (S.log.length > 400) S.log.shift(); }

  if (me && me.card && !NET.answered[me.card.id] && !modalOpen) showRemoteCard(me.card);
}
NET.lastLogId = 0;
function sendCmd(o) { emitSafe(T_CMD, Object.assign({ c: NET.code, s: NET.seat }, o)); }
function showRemoteCard(cd) {

}
let lastClientMe = '';
function clientPanels() {

      <div class="acts2" id="nacts">${me.acts.map(a => `<button class="btn" data-na="${a[0]}" ${me.g < a[2] ? 'disabled' : ''}>${a[1]}<small>${a[2]}</small></button>`).join('')}</div>

      ${me && !me.dead && !mine ? `<div class="acts"><button class="btn danger" data-nd="war">宣战</button><button class="btn" data-nd="peace">求和</button><button class="btn" data-nd="ally">结盟</button><button class="btn" data-nd="gift">厚礼</button><button class="btn" data-nd="spy">间谍</button>${F.mo ? '' : '<button class="btn" data-nd="marry">联姻</button>'}</div><p class="actmsg">指令会发给房主执行，结果见编年史。</p>` : ''}`;

document.addEventListener('click', ev => {
